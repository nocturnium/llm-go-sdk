site_name: llm-go-sdk
site_description: A unified, dependency-light Go SDK for 18 LLM providers.
site_url: https://nocturnium.github.io/llm-go-sdk/
repo_url: https://github.com/nocturnium/llm-go-sdk
repo_name: nocturnium/llm-go-sdk
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Nocturnium, Inc. — Apache-2.0

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    # Dark-first (the Nocturnium default); toggle to the light "daybreak" variant.
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/nocturnium.css

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nocturnium/llm-go-sdk
    - icon: fontawesome/brands/golang
      link: https://pkg.go.dev/github.com/nocturnium/llm-go-sdk/v4

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Providers: providers.md
  - Configuration: configuration.md
  - Guides:
      - Chat & Messages: guides/chat.md
      - Streaming: guides/streaming.md
      - Tool Calling & Agents: guides/tools.md
      - MCP (Model Context Protocol): guides/mcp.md
      - Structured Outputs: guides/structured-outputs.md
      - Reasoning: guides/reasoning.md
      - Prompt Caching: guides/caching.md
      - Embeddings & Reranking: guides/embeddings.md
      - Vision: guides/vision.md
      - Resilience: guides/resilience.md
      - Observability & Cost: guides/observability.md
      - Provider Registry: guides/registry.md
      - Custom Providers: guides/custom-providers.md
  - Architecture: ARCHITECTURE.md
  - Package Layout: migration-guide.md
  - API Reference (pkg.go.dev): https://pkg.go.dev/github.com/nocturnium/llm-go-sdk/v4
