name: PR Title Lint

# The auto-release workflow derives the next version from the squash-merge commit
# subject, which (with squash merges) is the PR title. This check enforces that PR
# titles follow Conventional Commits so the version bump is computed correctly:
# feat -> minor, fix -> patch, ! / BREAKING CHANGE -> major; other types do not
# trigger a release. Keep PRs squash-merged for this guarantee to hold.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Types accepted in the PR title. Mirrors cliff.toml's commit_parsers.
          types: |
            feat
            fix
            docs
            perf
            refactor
            style
            test
            build
            ci
            chore
            revert
          requireScope: false
          # A "type!: ..." or "type(scope)!: ..." breaking marker is allowed.
          # No subject-casing rule, to avoid friction on titles like "fix: API ...".
