name: Auto Release

# Automatically cuts a release when releasable conventional commits land on main.
#
# scripts/release-decide.sh computes the next semantic version from the commits since
# the latest root tag (feat gives minor, fix gives patch, ! or BREAKING CHANGE gives major). If nothing
# releasable landed (only docs/chore/ci/refactor/style/test/build commits), the
# run skips without tagging.
#
# This path is SELF-CONTAINED: it creates and pushes the tag, then runs GoReleaser in
# the same run. A tag pushed by the default GITHUB_TOKEN does not trigger the
# tag-gated release.yml (GitHub suppresses workflow recursion for GITHUB_TOKEN),
# so we release inline here rather than depending on that. release.yml remains
# the path for manual / emergency tags (`git push origin vX.Y.Z`).
#
# NOTE: PR squash-commit subjects must follow Conventional Commits for the bump
# to be computed correctly (feat:, fix:, feat!:, etc.). Non-conventional or
# docs/chore/ci-only changes intentionally do not produce a release.

on:
  push:
    branches: [main]

# Serialize releases; never cancel an in-flight one.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_VERSION: '1.26'

jobs:
  version:
    name: Compute next version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      previous: ${{ steps.decide.outputs.previous }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pinned git-cliff binary (not the floating action) so we control stdout:
      # `--bumped-version` prints the next version to stdout, and `--context`
      # gives the per-commit JSON we gate the release decision on.
      - name: Install git-cliff
        env:
          GIT_CLIFF_VERSION: '2.13.1'
        run: |
          # The tarball decides whether a release is cut, so it is verified
          # against a pinned digest before anything from it runs.
          GIT_CLIFF_SHA256='9a1263f24e59a2f508c7b3d3283c9dea94a8bf697f96dbc18cc783cac6284546'
          curl -fsSL -o git-cliff.tar.gz "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${GIT_CLIFF_SHA256}  git-cliff.tar.gz" | sha256sum -c -
          tar xzf git-cliff.tar.gz
          echo "${PWD}/git-cliff-${GIT_CLIFF_VERSION}" >> "$GITHUB_PATH"

      - name: Decide whether to release
        id: decide
        # scripts/release-decide.sh matches only root tags (vX.Y.Z) and counts only
        # commits touching paths outside llmadk/, which releases on its own lane
        # (llmadk-release.yml). A bare `git describe` would return an llmadk/ tag
        # when it is the newest one. scripts/release-decide_test.sh dry-runs the
        # lane rules against a scratch repository in CI.
        run: scripts/release-decide.sh root

  release:
    name: Tag & Release
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: go test -race ./...

      - name: Create and push tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "Tag ${VERSION} already exists; aborting to avoid clobber."
            exit 1
          fi
          git tag -a "${VERSION}" -m "${VERSION}"
          git push origin "${VERSION}"

      # GoReleaser's SBOM step shells out to syft, which is not preinstalled.
      - name: Install Syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned so GoReleaser never infers either tag: an llmadk/ tag can sit on
          # the same commit as the root tag.
          GORELEASER_CURRENT_TAG: ${{ needs.version.outputs.version }}
          GORELEASER_PREVIOUS_TAG: ${{ needs.version.outputs.previous }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ needs.version.outputs.version }}
          path: dist/*
          retention-days: 30

  # No changelog job: CHANGELOG.md is hand-written. A git-cliff regeneration
  # would replace the curated [Unreleased] prose with one line per commit, and
  # the release notes on the GitHub Release are produced by GoReleaser from the
  # same commits anyway. Rename [Unreleased] to the version when cutting one.
