name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
  schedule:
    # Run weekly on Monday at 8:00 UTC
    - cron: '0 8 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default permissions for every job. gosec/trivy upload SARIF and therefore need
# security-events: write (the analyze job additionally declares its own block).
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # Code scanning (SARIF upload) requires a public repo or GitHub Advanced
    # Security. Skip while the repo is private to avoid failing runs; this runs
    # automatically once the repository is made public.
    if: ${{ github.event.repository.private == false }}
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: +security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"

  # Additional security scanning
  gosec:
    name: Security Scan (gosec)
    runs-on: ubuntu-latest
    # Requires public repo / Advanced Security for SARIF upload (see analyze).
    if: ${{ github.event.repository.private == false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run gosec
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./...'

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  # Trivy vulnerability scanner
  trivy:
    name: Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    # Requires public repo / Advanced Security for SARIF upload (see analyze).
    if: ${{ github.event.repository.private == false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
