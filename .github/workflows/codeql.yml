name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
  pull_request:
    branches: [main]
    paths:
      - '**/*.go'
  schedule:
    # Run weekly on Monday at 8:00 UTC
    - cron: '0 8 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default permissions for every job. gosec/trivy upload SARIF and therefore need
# security-events: write (the analyze job additionally declares its own block).
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # Code scanning (SARIF upload) requires a public repo or GitHub Advanced
    # Security. Skip while the repo is private to avoid failing runs; this runs
    # automatically once the repository is made public.
    if: ${{ github.event.repository.private == false }}
    timeout-minutes: 30
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          # Query suites and path filters (e.g. ignoring examples/) live in the
          # config file so there is a single source of truth.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"

  # Additional security scanning
  gosec:
    name: Security Scan (gosec)
    runs-on: ubuntu-latest
    # Requires public repo / Advanced Security for SARIF upload (see analyze).
    if: ${{ github.event.repository.private == false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run gosec
        uses: securego/gosec@master
        with:
          # G101 (hardcoded credentials) and G104 (unhandled errors) are excluded
          # to mirror .golangci.yml: G101 only fires on env-var-name and OTel
          # attribute-key string constants here (no real secrets), and G104 is
          # already covered by errcheck. Other rules (incl. G304/G404) stay on and
          # are suppressed at specific justified sites with `// #nosec`.
          args: '-no-fail -exclude=G101,G104 -fmt sarif -out results.sarif ./...'

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  # Trivy vulnerability scanner
  trivy:
    name: Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    # Requires public repo / Advanced Security for SARIF upload (see analyze).
    if: ${{ github.event.repository.private == false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
