# open-nitpick review configuration for llm-go-sdk.
#
# Full-review comparison (2026-09-16) against 525 files showed config-B
# (laguna reviewer + luna flex triage) gives the best signal-to-noise ratio
# and 12-minute wall time. See open-nitpick docs/full-review-comparison-llm-go-sdk.md.
#
# To run:
#   OPENROUTER_API_KEY=... nitpick full-review -repo .
#
# For the supplementary concurrency pass (luna reviewer + glm triage):
#   OPENROUTER_API_KEY=... nitpick full-review -repo . -config .nitpick-concurrency.yaml

models:
  # Reviewer: laguna-s-2.1 — R=0.87, N=0.09 on open-nitpick tuning corpus (2 runs).
  # Cleanest noise floor of any model measured; recall matches deepseek at 10x lower cost.
  # Context does not help on this corpus; leave related_context off.
  #
  # Pin review (not only default): a user-level models.review wins over repo
  # models.default, which is how deepseek/deepseek-v4.1-flash took 55/88
  # batches on the first full-review after a3d3d56.
  default:
    provider: openrouter
    model: poolside/laguna-s-2.1
    timeout: 15m

  review:
    provider: openrouter
    model: poolside/laguna-s-2.1
    timeout: 15m

  # Triage: luna flex — perfect precision and class accuracy; $0.0004/call.
  # Cut 72 raw findings to 42 in the comparison run, preserving the high-signal ones.
  triage:
    provider: openrouter
    model: openai/gpt-5.6-luna
    service_tier: flex
    temperature: 0

review:
  max_files: 200
  token_budget_per_request: 60000
  fail_on: none
  min_severity: info
  related_context: false
  slop: true
  ignore:
    - "**/vendor/**"
    - "**/*.pb.go"
    - "api/v6.txt"

linters:
  mode: "off"

instructions:
  - path: "**/*.go"
    prompt: >-
      This is a provider SDK. Weigh correctness of provider wire mapping, usage
      and cost accounting, error-sentinel mapping and context/goroutine handling
      above style. Pricing and model metadata must never be invented: a rate
      that is not verifiable against the provider's own page should be reported
      as unpriced, not guessed.
  - path: "pkg/providers/**"
    prompt: >-
      Check that credentials never travel to an asset or callback host, that
      unmapped typed options are rejected rather than silently dropped, and that
      Extra maps cannot overwrite reserved typed request fields.
  - path: "**/*_test.go"
    prompt: >-
      Flag tests that mirror the implementation instead of asserting behavior,
      and mock servers that encode an unverified belief about the provider API.
