# open-nitpick review configuration for llm-go-sdk.
#
# Reviewers: deepseek-flash-latest and glm-flash-latest run as an ensemble on
# every batch, so a finding one model misses the other can catch. Triage:
# qwen3.8-27b, a small model that culls the raw findings down to the ones worth
# acting on.
#
# The "~" prefix marks an OpenRouter "latest" alias that tracks the current
# point release (deepseek-flash-latest -> deepseek-v4.1-flash,
# glm-flash-latest -> glm-5.3-flash).
#
# To run:
#   OPENROUTER_API_KEY=... nitpick full-review -repo .

models:
  # reasoning: off and max_tokens: 16384: under an inherited max_tokens: 8192 a
  # reasoning model spent the budget on thinking (finish_reason=length, content
  # empty) and left files unreviewed. Forcing reasoning off keeps the answer in
  # content; 16384 leaves room for a large batch's findings.
  default:
    provider: openrouter
    model: "~deepseek/deepseek-flash-latest"
    timeout: 15m
    reasoning: off
    max_tokens: 16384

  # Pin review (not only default): a user-level models.review overrides the
  # repo's models.default, so the reviewer is named here rather than left to
  # the default alone.
  review:
    provider: openrouter
    model: "~deepseek/deepseek-flash-latest"
    timeout: 15m
    reasoning: off
    max_tokens: 16384

  # The second reviewer, run on every batch alongside the review model.
  ensemble:
    - provider: openrouter
      model: "~z-ai/glm-flash-latest"
      timeout: 15m
      reasoning: off
      max_tokens: 16384

  # Triage: a small, fast model that cuts the raw findings to the high-signal
  # ones. Temperature 0 so the same diff triages the same way twice.
  #
  # reasoning: off, like the reviewers: left at the model's default, qwen3.8-27b
  # spends the whole budget thinking over a full-size finding list and never
  # answers, so triage stalls until the call times out. With reasoning off the
  # same list returns an answer.
  #
  # structured_output: json, not the default auto: qwen3.8-27b's endpoint never
  # answers a strict json_schema request over a full review's finding list, while
  # plain JSON mode returns. The schema still rides in the prompt, and a reply
  # that does not parse is treated as a failed triage rather than a wrong one.
  #
  # max_tokens: 32768 covers a normal PR diff. A whole-tree review produces a
  # finding list too large for one call: the reply does not parse as the expected
  # shape, so triage fails and publishes the findings untriaged. CI reviews one
  # PR diff at a time, which stays well under that.
  triage:
    provider: openrouter
    model: qwen/qwen3.8-27b
    timeout: 15m
    temperature: 0
    reasoning: off
    max_tokens: 32768
    structured_output: json

review:
  # The repository currently tracks over 600 reviewable files. A lower cap
  # silently turns a full review into a partial one, so leave headroom here
  # rather than having the gate report on a subset of the tree.
  max_files: 1000
  token_budget_per_request: 60000
  fail_on: none
  min_severity: info
  related_context: false
  slop: true
  ignore:
    - "**/vendor/**"
    - "**/*.pb.go"
    - "api/v6.txt"

linters:
  mode: "off"

instructions:
  - path: "**/*.go"
    prompt: >-
      This is a provider SDK. Weigh correctness of provider wire mapping, usage
      and cost accounting, error-sentinel mapping and context/goroutine handling
      above style. Pricing and model metadata must never be invented: a rate
      that is not verifiable against the provider's own page should be reported
      as unpriced, not guessed.
  - path: "pkg/providers/**"
    prompt: >-
      Check that credentials never travel to an asset or callback host, that
      unmapped typed options are rejected rather than silently dropped, and that
      Extra maps cannot overwrite reserved typed request fields.
  - path: "**/*_test.go"
    prompt: >-
      Flag tests that mirror the implementation instead of asserting behavior,
      and mock servers that encode an unverified belief about the provider API.
